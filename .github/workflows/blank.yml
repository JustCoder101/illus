name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer<1.6.0" "cython<3.0.0"

    - name: Configure buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Базовые настройки проекта
        sed -i 's/title = My Application/title = iLLuS/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = illus/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.krutoy/g' buildozer.spec
        sed -i 's/fullscreen = 0/fullscreen = 1/g' buildozer.spec
        sed -i 's/#android.archs = arm64-v8a/android.archs = arm64-v8a/g' buildozer.spec
        
        # Настройки под PyGame 2
        sed -i 's/requirements = .*/requirements = python3, pygame==2.5.2, hostpython3, android/g' buildozer.spec
        sed -i 's/#p4a.branch = .*/p4a.branch = master/g' buildozer.spec
        
        # Фиксация версий SDK/NDK и сброс Build-Tools на стабильную версию
        sed -i 's/#android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/#android.minapi = 21/android.minapi = 24/g' buildozer.spec
        sed -i 's/#android.ndk =.*/android.ndk = 25b/g' buildozer.spec
        sed -i 's/#android.build_tools_version =.*/android.build_tools_version = 33.0.0/g' buildozer.spec

    - name: Pre-accept Android SDK Licenses
      run: |
        # Этот шаг находит менеджер лицензий Android SDK на виртуалке и насильно принимает их все
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build with Buildozer
      run: |
        buildozer -v android debug
